name: Build Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger a build manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ESP-IDF 5.3.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: example/ESP-IDF-5.3.2/ESP32-S3-Touch-LCD-1.46-Test

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            example/ESP-IDF-5.3.2/ESP32-S3-Touch-LCD-1.46-Test/build/*.bin
            example/ESP-IDF-5.3.2/ESP32-S3-Touch-LCD-1.46-Test/build/flasher_args.json
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            example/ESP-IDF-5.3.2/ESP32-S3-Touch-LCD-1.46-Test/build/*.bin
            example/ESP-IDF-5.3.2/ESP32-S3-Touch-LCD-1.46-Test/build/flasher_args.json
